<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 300" width="100%" height="100%" style="border-radius: 8px;">
  <defs>
    <!-- Cyan glow -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pink glow -->
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Yellow/Orange glow -->
    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid background pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0f1422" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&amp;family=Orbitron:wght@600;700&amp;display=swap');
    
    .bg { fill: #07090e; }
    .grid-overlay { fill: url(#grid); }
    
    /* Conduits (Pipes) */
    .conduit-bg { stroke: #111827; fill: none; stroke-width: 6; stroke-linecap: round; }
    .conduit-cyan { stroke: #00f2fe; fill: none; stroke-width: 2; opacity: 0.6; filter: url(#glow-cyan); }
    .conduit-pink { stroke: #f43f5e; fill: none; stroke-width: 2; opacity: 0.6; filter: url(#glow-pink); }
    .conduit-orange { stroke: #fb923c; fill: none; stroke-width: 2; opacity: 0.6; filter: url(#glow-orange); }

    /* Nodes */
    .node-box { fill: #0d1321; stroke: #1e293b; stroke-width: 1.5; rx: 8; ry: 8; transition: all 0.3s; }
    .node-box:hover { stroke: #38bdf8; fill: #111c30; }
    
    .node-box-active { fill: #0b1e2d; stroke: #00f2fe; stroke-width: 2; rx: 8; ry: 8; filter: url(#glow-cyan); }
    
    /* Text */
    .node-title { font-family: 'Orbitron', sans-serif; font-size: 11px; fill: #ffffff; font-weight: bold; letter-spacing: 1px; }
    .node-subtitle { font-family: 'Fira Code', monospace; font-size: 8px; fill: #94a3b8; }
    .pipeline-title { font-family: 'Orbitron', sans-serif; font-size: 12px; fill: #475569; font-weight: bold; letter-spacing: 2px; }

    /* Keyframes for simple pulses */
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    .status-pulse { animation: pulse 2s infinite; }
  </style>

  <!-- Background layers -->
  <rect width="830" height="300" class="bg" />
  <rect width="830" height="300" class="grid-overlay" />

  <!-- Borders -->
  <rect x="0" y="0" width="830" height="300" fill="none" stroke="#1f2a45" stroke-width="2" />
  <line x1="0" y1="0" x2="830" y2="0" stroke="#00f2fe" stroke-width="2" filter="url(#glow-cyan)" />

  <!-- Pipeline Category Labels -->
  <text x="30" y="30" class="pipeline-title">INBOUND PIPELINE (RECEIVING &amp; PROCUREMENT)</text>
  <text x="30" y="275" class="pipeline-title">OUTBOUND PIPELINE (SALES &amp; SHIPPING)</text>

  <!-- Define Paths for conduits and animations -->
  <!-- Inbound Path: Supplier -> PO -> Goods Receipt -> Warehouse -->
  <path id="path-inbound" d="M 80,75 H 240 H 400 Q 580,75 580,117 V 145" class="conduit-bg" />
  <path d="M 80,75 H 240 H 400 Q 580,75 580,117 V 145" class="conduit-cyan" />

  <!-- Outbound Path: Warehouse -> Sales Order -> Shipment -> Customer -->
  <path id="path-outbound" d="M 580,145 V 180 Q 580,220 540,220 H 80" class="conduit-bg" />
  <path d="M 580,145 V 180 Q 580,220 540,220 H 80" class="conduit-pink" />

  <!-- Stock Transfer Loop: Warehouse -> Stock Transfer -> Warehouse -->
  <path id="path-transfer" d="M 645,135 C 710,100 770,110 770,145 C 770,180 710,190 645,155" class="conduit-bg" />
  <path d="M 645,135 C 710,100 770,110 770,145 C 770,180 710,190 645,155" class="conduit-orange" />

  <!-- Animated cargo dots moving along the paths -->
  <!-- Inbound moving dots (Cyan) -->
  <circle r="5" fill="#00ffff" filter="url(#glow-cyan)">
    <animateMotion dur="5s" repeatCount="indefinite">
      <mpath href="#path-inbound" />
    </animateMotion>
  </circle>
  <circle r="5" fill="#00ffff" filter="url(#glow-cyan)">
    <animateMotion dur="5s" begin="2.5s" repeatCount="indefinite">
      <mpath href="#path-inbound" />
    </animateMotion>
  </circle>

  <!-- Outbound moving dots (Pink) -->
  <circle r="5" fill="#ff2e93" filter="url(#glow-pink)">
    <animateMotion dur="5s" repeatCount="indefinite">
      <mpath href="#path-outbound" />
    </animateMotion>
  </circle>
  <circle r="5" fill="#ff2e93" filter="url(#glow-pink)">
    <animateMotion dur="5s" begin="2.5s" repeatCount="indefinite">
      <mpath href="#path-outbound" />
    </animateMotion>
  </circle>

  <!-- Stock Transfer moving dots (Orange) -->
  <circle r="4" fill="#fb923c" filter="url(#glow-orange)">
    <animateMotion dur="3s" repeatCount="indefinite">
      <mpath href="#path-transfer" />
    </animateMotion>
  </circle>

  <!-- ================= NODES RENDERING ================= -->

  <!-- Node 1: SUPPLIER -->
  <g transform="translate(25, 50)">
    <rect width="110" height="50" class="node-box" />
    <text x="12" y="22" class="node-title">SUPPLIER</text>
    <text x="12" y="34" class="node-subtitle">supplier_id (PK)</text>
    <text x="12" y="44" class="node-subtitle">is_active = 'Y'</text>
    <circle cx="98" cy="12" r="3" fill="#4ade80" />
  </g>

  <!-- Node 2: PURCHASE ORDER -->
  <g transform="translate(185, 50)">
    <rect width="110" height="50" class="node-box" />
    <text x="12" y="22" class="node-title">PURCHASE ORDR</text>
    <text x="12" y="34" class="node-subtitle">po_line_id (PK)</text>
    <text x="12" y="44" class="node-subtitle">qty_ordered</text>
    <circle cx="98" cy="12" r="3" fill="#38bdf8" />
  </g>

  <!-- Node 3: GOODS RECEIPT -->
  <g transform="translate(345, 50)">
    <rect width="110" height="50" class="node-box" />
    <text x="12" y="22" class="node-title">GOODS RECEIPT</text>
    <text x="12" y="34" class="node-subtitle">receipt_number</text>
    <text x="12" y="44" class="node-subtitle">trg_goods_receipt_bi</text>
    <circle cx="98" cy="12" r="3" fill="#38bdf8" />
  </g>

  <!-- Node 4: WAREHOUSE / INVENTORY (Central Hub) -->
  <g transform="translate(510, 115)">
    <rect width="140" height="60" class="node-box-active" />
    <text x="15" y="22" class="node-title" fill="#00f2fe">WAREHOUSE INV</text>
    <text x="15" y="36" class="node-subtitle" fill="#93c5fd">qty_on_hand (LOCK)</text>
    <text x="15" y="46" class="node-subtitle" fill="#93c5fd">qty_reserved &lt;= hand</text>
    <text x="15" y="54" class="node-subtitle" fill="#38bdf8">pkg_stock_movement</text>
    <circle cx="125" cy="15" r="4" fill="#00f2fe" class="status-pulse" filter="url(#glow-cyan)" />
  </g>

  <!-- Node 5: SALES ORDER -->
  <g transform="translate(345, 195)">
    <rect width="110" height="50" class="node-box" />
    <text x="12" y="22" class="node-title">SALES ORDER</text>
    <text x="12" y="34" class="node-subtitle">so_line_id (PK)</text>
    <text x="12" y="44" class="node-subtitle">qty_reserved (+)</text>
    <circle cx="98" cy="12" r="3" fill="#f43f5e" />
  </g>

  <!-- Node 6: SHIPMENT -->
  <g transform="translate(185, 195)">
    <rect width="110" height="50" class="node-box" />
    <text x="12" y="22" class="node-title">SHIPMENT</text>
    <text x="12" y="34" class="node-subtitle">shipment_number</text>
    <text x="12" y="44" class="node-subtitle">qty_reserved (-)</text>
    <circle cx="98" cy="12" r="3" fill="#f43f5e" />
  </g>

  <!-- Node 7: CUSTOMER -->
  <g transform="translate(25, 195)">
    <rect width="110" height="50" class="node-box" />
    <text x="12" y="22" class="node-title">CUSTOMER</text>
    <text x="12" y="34" class="node-subtitle">customer_id (PK)</text>
    <text x="12" y="44" class="node-subtitle">is_active = 'Y'</text>
    <circle cx="98" cy="12" r="3" fill="#4ade80" />
  </g>

  <!-- Node 8: STOCK TRANSFER -->
  <g transform="translate(710, 115)">
    <rect width="100" height="50" class="node-box" />
    <text x="12" y="20" class="node-title" fill="#fb923c">TRANSFER</text>
    <text x="12" y="32" class="node-subtitle">from_loc &lt;&gt; to_loc</text>
    <text x="12" y="42" class="node-subtitle">transfer_id (PK)</text>
    <circle cx="88" cy="12" r="3" fill="#fb923c" />
  </g>
</svg>
